services:
  billing-service:
    build:
      context: ../..
      dockerfile: infrastructure/node/Dockerfile
      args:
        SERVICE_PACKAGE: "@saas/billing-service"
    environment:
      PORT: ${PORT}
    ports:
      - "${HOST_PORT}:${PORT}"
    networks:
      - saas-gateway

networks:
  saas-gateway:
    external: true
