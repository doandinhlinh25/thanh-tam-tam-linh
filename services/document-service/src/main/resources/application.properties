server.port=${PORT}
spring.datasource.url=${DOCUMENT_JDBC_URL}
spring.datasource.username=${DOCUMENT_DATABASE_USERNAME}
spring.datasource.password=${DOCUMENT_DATABASE_PASSWORD}
spring.data.redis.url=${DOCUMENT_REDIS_URL}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_BYTES}B
spring.servlet.multipart.max-request-size=-1
spring.servlet.multipart.resolve-lazily=true
document.max-upload-bytes=${MAX_UPLOAD_BYTES}
document.s3.bucket=${DOCUMENT_S3_BUCKET}
document.s3.region=${DOCUMENT_S3_REGION}
document.s3.endpoint=${DOCUMENT_S3_ENDPOINT:}
document.authorization.url=${DOCUMENT_UPLOAD_AUTH_URL}
document.authorization.token=${DOCUMENT_SERVICE_TOKEN}
document.authorization.timeout-ms=${DOCUMENT_AUTH_TIMEOUT_MS}
