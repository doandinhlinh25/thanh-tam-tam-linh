x-service-base: &service-base
  environment:
    PORT: ${SERVICE_PORT}
  networks:
    - saas-gateway

services:
  identity-service:
    <<: *service-base
    build:
      context: ../..
      dockerfile: infrastructure/node/Dockerfile
      args:
        SERVICE_PACKAGE: "@saas/identity-service"

  auth-service:
    <<: *service-base
    build:
      context: ../..
      dockerfile: infrastructure/node/Dockerfile
      args:
        SERVICE_PACKAGE: "@saas/auth-service"
    env_file:
      - ../../services/auth-service/.env
    environment:
      PORT: ${SERVICE_PORT}

  tenant-service:
    <<: *service-base
    build:
      context: ../..
      dockerfile: infrastructure/node/Dockerfile
      args:
        SERVICE_PACKAGE: "@saas/tenant-service"
    env_file:
      - ../../services/tenant-service/.env
    environment:
      PORT: ${SERVICE_PORT}
      AUTH_SERVICE_URL: http://auth-service:${SERVICE_PORT}

  billing-service:
    <<: *service-base
    build:
      context: ../..
      dockerfile: infrastructure/node/Dockerfile
      args:
        SERVICE_PACKAGE: "@saas/billing-service"

  notification-service:
    <<: *service-base
    build:
      context: ../..
      dockerfile: infrastructure/node/Dockerfile
      args:
        SERVICE_PACKAGE: "@saas/notification-service"

networks:
  saas-gateway:
    external: true
