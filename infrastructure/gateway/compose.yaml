services:
  kong:
    build:
      context: ./kong
      args:
        KONG_BASE_IMAGE: ${KONG_IMAGE}
    image: saas-kong-opa-authorizer
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PLUGINS: bundled,opa-authorizer
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    ports:
      - "${KONG_PROXY_PORT}:8000"
      - "127.0.0.1:${KONG_ADMIN_PORT}:8001"
    depends_on:
      - opa
    networks:
      - saas-gateway

  opa:
    image: ${OPA_IMAGE}
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policies
    volumes:
      - ./opa/policies:/policies:ro
    networks:
      - saas-gateway

networks:
  saas-gateway:
    name: saas-gateway
