openapi: 3.0.3
info:
  title: Internal Retrieval and Reranker Contract
  version: 0.1.0
  description: |
    Proposed service-to-service contract for alignment between Chat Service and
    Document/Retrieval/Reranker owners. This is not a public client API. Authentication
    scheme and service DNS/path must be confirmed by the platform lead.
servers:
  - url: /internal/v1
security:
  - serviceBearerAuth: []
paths:
  /retrieval/search:
    post:
      operationId: searchEvidence
      summary: Retrieve authorized evidence candidates
      description: |
        Tenant, course and user values must be derived by the calling service from
        trusted authentication and authorization context. The retrieval owner must
        enforce tenant/course/document ACL before returning any candidate. Deleted
        or inaccessible documents must never appear in the result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CourseOnlyRetrievalRequest'
                - $ref: '#/components/schemas/PersonalOnlyRetrievalRequest'
                - $ref: '#/components/schemas/CombinedRetrievalRequest'
      responses:
        '200':
          description: Authorized evidence candidates; an empty array means no candidate was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalSuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /reranker/rank:
    post:
      operationId: rerankEvidence
      summary: Rank retrieval candidates using a selected reranker
      description: |
        Variant A (dense retrieval only) does not call this endpoint. Variant B uses
        the baseline reranker; variant C uses the fine-tuned reranker. Every returned
        evidence_id must be a member of the submitted candidate set. The caller must
        not compare raw scores from different model versions as if they shared a scale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankRequest'
      responses:
        '200':
          description: Candidates ordered by rank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankSuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

components:
  securitySchemes:
    serviceBearerAuth:
      type: http
      scheme: bearer
      description: Provisional internal service credential; confirm token format and rotation with the platform lead.
  responses:
    BadRequest:
      description: Invalid internal request.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
    Unauthorized:
      description: Missing or invalid service credential.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
    Forbidden:
      description: Caller is not authorized for the requested data scope.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
    TooManyRequests:
      description: Inference or service quota was exceeded.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
    InternalServerError:
      description: Unexpected service error.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
    ServiceUnavailable:
      description: Retrieval index or reranker is not ready.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
    GatewayTimeout:
      description: Retrieval or reranker timed out.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
  schemas:
    SourceScope:
      type: string
      enum: [course_only, personal_only, combined]
    SourceType:
      type: string
      enum: [official, personal]
    CourseOnlyRetrievalRequest:
      type: object
      additionalProperties: false
      required: [request_id, scope, tenant_id, course_id, query, candidate_k]
      properties:
        request_id:
          type: string
          minLength: 1
        scope:
          type: string
          enum: [course_only]
        tenant_id:
          type: string
          minLength: 1
          description: Trusted tenant identifier supplied by the calling service, never directly copied from a client request.
        course_id:
          type: string
          minLength: 1
        query:
          type: string
          minLength: 1
          maxLength: 4000
        candidate_k:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    PersonalOnlyRetrievalRequest:
      type: object
      additionalProperties: false
      required: [request_id, scope, tenant_id, user_id, query, candidate_k]
      properties:
        request_id:
          type: string
          minLength: 1
        scope:
          type: string
          enum: [personal_only]
        tenant_id:
          type: string
          minLength: 1
        user_id:
          type: string
          minLength: 1
          description: Trusted user identifier; personal document ACL must be enforced by the retrieval owner.
        query:
          type: string
          minLength: 1
          maxLength: 4000
        candidate_k:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    CombinedRetrievalRequest:
      type: object
      additionalProperties: false
      required: [request_id, scope, tenant_id, course_id, user_id, query, candidate_k]
      properties:
        request_id:
          type: string
          minLength: 1
        scope:
          type: string
          enum: [combined]
        tenant_id:
          type: string
          minLength: 1
        course_id:
          type: string
          minLength: 1
        user_id:
          type: string
          minLength: 1
          description: Trusted user identifier used to restrict personal evidence to the caller's own documents.
        query:
          type: string
          minLength: 1
          maxLength: 4000
        candidate_k:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    RetrievalCandidate:
      type: object
      required: [evidence_id, chunk_id, document_id, document_version, source_type, document_name, page_from, page_to, text, retrieval_score]
      properties:
        evidence_id:
          type: string
          description: Request-scoped identifier used to map generated citations back to retrieved evidence.
        chunk_id:
          type: string
        document_id:
          type: string
        document_version:
          type: integer
          minimum: 1
        source_type:
          $ref: '#/components/schemas/SourceType'
        document_name:
          type: string
        page_from:
          type: integer
          minimum: 1
        page_to:
          type: integer
          minimum: 1
        text:
          type: string
          minLength: 1
        retrieval_score:
          type: number
        section_title:
          type: string
          nullable: true
    RetrievalResult:
      type: object
      required: [request_id, retriever_version, candidates]
      properties:
        request_id:
          type: string
        retriever_version:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalCandidate'
    RetrievalSuccessEnvelope:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RetrievalResult'
    RerankRequest:
      type: object
      additionalProperties: false
      required: [request_id, query, variant, candidates]
      properties:
        request_id:
          type: string
          minLength: 1
        query:
          type: string
          minLength: 1
          maxLength: 4000
        variant:
          type: string
          enum: [base, finetuned]
        candidates:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RerankCandidateInput'
    RerankCandidateInput:
      type: object
      additionalProperties: false
      required: [evidence_id, text, retrieval_score]
      properties:
        evidence_id:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
        retrieval_score:
          type: number
    RerankedCandidate:
      type: object
      required: [evidence_id, rank, rerank_score]
      properties:
        evidence_id:
          type: string
        rank:
          type: integer
          minimum: 1
        rerank_score:
          type: number
    RerankResult:
      type: object
      required: [request_id, variant, reranker_version, candidates]
      properties:
        request_id:
          type: string
        variant:
          type: string
          enum: [base, finetuned]
        reranker_version:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/RerankedCandidate'
    RerankSuccessEnvelope:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RerankResult'
