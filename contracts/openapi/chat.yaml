openapi: 3.0.3
info:
  title: Chat and RAG API
  version: 0.1.0
  description: |
    Draft public contract for the Chat Service. All successful responses use the
    shared ApiSuccessResponse envelope and all technical failures use
    ApiFailureResponse. The status "error" is a UI state, not a successful chat
    result. Cookie and CSRF names are provisional until confirmed by the platform lead.
servers:
  - url: /api/v1
tags:
  - name: Chat
    description: Ask questions using authorized course and personal documents.
  - name: Conversations
    description: Read and delete conversations owned by the authenticated user.
  - name: Feedback
    description: Record user feedback for an assistant message.
security:
  - sessionCookie: []
paths:
  /courses/{courseId}/chat:
    post:
      tags: [Chat]
      operationId: askCourseMaterials
      summary: Ask a question using course materials
      description: |
        The caller must be authenticated and enrolled or otherwise authorized for
        the course. The Chat Service must validate course access before retrieval.
        In combined mode, retrieval may additionally include only personal documents
        owned by the authenticated user. Never accept tenant_id or user_id from the
        request body as authorization evidence.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: Course identifier; authorization is checked server-side.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseChatRequest'
      responses:
        '200':
          description: Answered with verified citations, or safely refused for insufficient evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /personal-documents/chat:
    post:
      tags: [Chat]
      operationId: askPersonalDocuments
      summary: Ask a question using the caller's personal documents
      description: |
        Retrieval is restricted to personal documents owned by the authenticated
        user in the active tenant. If no sufficient evidence is found, return
        insufficient_evidence with an empty citations array. A missing or empty
        personal corpus is not a technical error.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalChatRequest'
      responses:
        '200':
          description: Answered with verified citations, or safely refused for insufficient evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List conversations owned by the authenticated user
      description: |
        The service filters by the authenticated user and trusted tenant context.
        A caller cannot list another user's conversations by changing query parameters.
      parameters:
        - name: course_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: source_scope
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SourceScope'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor returned by the previous response.
          schema:
            type: string
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: A page of conversations owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /conversations/{conversationId}:
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Get a conversation and its messages
      description: |
        The conversation must belong to the authenticated user and active tenant.
        Return 404 for both a missing conversation and one the caller is not allowed
        to see, so the endpoint does not disclose resource existence.
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque cursor for older messages.
          schema:
            type: string
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Conversation details and a page of messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetailEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Conversations]
      operationId: deleteConversation
      summary: Delete a conversation owned by the authenticated user
      description: |
        Deletes the Chat Service-owned conversation, messages, citations and feedback.
        It does not delete source documents; those remain owned by Document Service.
        Backup and audit-log deletion semantics must follow the organization-wide
        privacy policy and remain an explicit implementation decision.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Conversation-owned data was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDeletionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /messages/{messageId}/feedback:
    post:
      tags: [Feedback]
      operationId: submitMessageFeedback
      summary: Create or update feedback for an assistant message
      description: |
        Feedback is scoped to the authenticated user and tenant. Repeating this
        request for the same user and message updates that user's existing feedback
        instead of creating duplicate records. The message must be an assistant message.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: Feedback was saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: saas_session
      description: |
        PROVISIONAL NAME ONLY. Confirm the actual session cookie name and attributes
        with the platform/auth lead before implementation.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        PROVISIONAL HEADER NAME ONLY. Confirm the CSRF strategy and header name with
        the platform/auth lead before implementation.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation ID. The server creates one when absent and returns the resolved ID in response metadata/logs.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    BadRequest:
      description: Invalid request or validation failure.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
    Unauthorized:
      description: Missing, invalid or expired session.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
    Forbidden:
      description: The caller is authenticated but is not allowed to access the requested course or scope.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
    Conflict:
      description: The conversation does not match the requested course or source scope.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
    TooManyRequests:
      description: Tenant or user quota was exceeded.
      headers:
        Retry-After:
          description: Optional number of seconds before retrying.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
    InternalServerError:
      description: Unexpected internal error. Do not return provider secrets or prompt contents.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
    BadGateway:
      description: An upstream LLM provider returned an invalid response or failed.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
    ServiceUnavailable:
      description: Retrieval or reranker service is unavailable.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
    GatewayTimeout:
      description: An upstream retrieval, reranker or LLM request timed out.
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ApiFailureResponse'
  schemas:
    SourceScope:
      type: string
      enum: [course_only, personal_only, combined]
      description: Knowledge source scope used by a conversation.
    ChatStatus:
      type: string
      enum: [answered, insufficient_evidence]
      description: |
        Technical failures are represented by an HTTP error and ApiFailureResponse,
        never by a successful response with status error.
    PipelineVariant:
      type: string
      enum: [A, B, C]
      description: A=dense retrieval only; B=dense plus base reranker; C=dense plus fine-tuned reranker.
    CourseChatRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4000
          description: User question. The 4000-character limit is a provisional MVP guardrail.
        conversation_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Omit to start a new conversation.
        source_scope:
          type: string
          enum: [course_only, combined]
          default: course_only
          description: Combined scope adds only the caller's own personal documents to authorized course evidence.
    PersonalChatRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4000
          description: User question. The 4000-character limit is a provisional MVP guardrail.
        conversation_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Omit to start a new personal-document conversation.
    ChatResponse:
      oneOf:
        - $ref: '#/components/schemas/AnsweredChatEnvelope'
        - $ref: '#/components/schemas/InsufficientEvidenceChatEnvelope'
    AnsweredChatEnvelope:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AnsweredChatResult'
    InsufficientEvidenceChatEnvelope:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/InsufficientEvidenceChatResult'
    AnsweredChatResult:
      type: object
      required: [request_id, conversation_id, message_id, status, source_scope, answer, citations, pipeline]
      properties:
        request_id:
          type: string
          description: Resolved request correlation ID.
        conversation_id:
          type: string
        message_id:
          type: string
        status:
          type: string
          enum: [answered]
        source_scope:
          $ref: '#/components/schemas/SourceScope'
        answer:
          type: string
          minLength: 1
        citations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatCitation'
        pipeline:
          $ref: '#/components/schemas/AnsweredPipelineMetadata'
    InsufficientEvidenceChatResult:
      type: object
      required: [request_id, conversation_id, message_id, status, source_scope, answer, citations, pipeline]
      properties:
        request_id:
          type: string
        conversation_id:
          type: string
        message_id:
          type: string
        status:
          type: string
          enum: [insufficient_evidence]
        source_scope:
          $ref: '#/components/schemas/SourceScope'
        answer:
          type: string
          minLength: 1
          description: Safe refusal message; must not assert unsupported facts.
        citations:
          type: array
          maxItems: 0
          description: Must be empty when the evidence gate refuses to answer.
          items:
            $ref: '#/components/schemas/ChatCitation'
        pipeline:
          $ref: '#/components/schemas/PipelineMetadata'
    ChatCitation:
      type: object
      required: [citation_id, evidence_id, source_type, document_id, document_name, page_from, page_to, snippet]
      properties:
        citation_id:
          type: string
          description: Server-owned citation identifier.
        evidence_id:
          type: string
          description: Evidence identifier from the retrieval snapshot used for this answer.
        source_type:
          type: string
          enum: [official, personal]
          description: Distinguishes official course materials from user-uploaded personal documents.
        document_id:
          type: string
        document_name:
          type: string
        page_from:
          type: integer
          minimum: 1
        page_to:
          type: integer
          minimum: 1
          description: Must be greater than or equal to page_from.
        snippet:
          type: string
          minLength: 1
          description: Server-derived excerpt from the evidence snapshot, not free-form LLM metadata.
    PipelineMetadata:
      type: object
      required: [variant, retriever_version, latency_ms]
      properties:
        variant:
          $ref: '#/components/schemas/PipelineVariant'
        retriever_version:
          type: string
        reranker_version:
          type: string
          nullable: true
        llm_model:
          type: string
          nullable: true
          description: Null when evidence gating rejects the question before generation.
        prompt_version:
          type: string
          nullable: true
          description: Null when evidence gating rejects the question before generation.
        latency_ms:
          type: integer
          minimum: 0
    AnsweredPipelineMetadata:
      allOf:
        - $ref: '#/components/schemas/PipelineMetadata'
        - type: object
          required: [llm_model, prompt_version]
          properties:
            llm_model:
              type: string
              minLength: 1
            prompt_version:
              type: string
              minLength: 1
    ConversationSummary:
      type: object
      required: [conversation_id, course_id, source_scope, title, created_at, updated_at, last_message_at]
      properties:
        conversation_id:
          type: string
        course_id:
          type: string
          nullable: true
        source_scope:
          $ref: '#/components/schemas/SourceScope'
        title:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_message_at:
          type: string
          format: date-time
          nullable: true
    ConversationList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationSummary'
        next_cursor:
          type: string
          nullable: true
    ConversationListEnvelope:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ConversationList'
    ChatMessage:
      type: object
      required: [message_id, role, content, citations, created_at]
      properties:
        message_id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        status:
          type: string
          nullable: true
          enum: [answered, insufficient_evidence]
        citations:
          type: array
          items:
            $ref: '#/components/schemas/ChatCitation'
        created_at:
          type: string
          format: date-time
    ConversationDetail:
      type: object
      required: [conversation_id, course_id, source_scope, title, messages, next_cursor, created_at, updated_at]
      properties:
        conversation_id:
          type: string
        course_id:
          type: string
          nullable: true
        source_scope:
          $ref: '#/components/schemas/SourceScope'
        title:
          type: string
          nullable: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        next_cursor:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConversationDetailEnvelope:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ConversationDetail'
    FeedbackRequest:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating:
          type: string
          enum: [positive, negative]
        comment:
          type: string
          maxLength: 2000
    FeedbackResult:
      type: object
      required: [feedback_id, message_id, rating, created_at]
      properties:
        feedback_id:
          type: string
        message_id:
          type: string
        rating:
          type: string
          enum: [positive, negative]
        created_at:
          type: string
          format: date-time
    FeedbackEnvelope:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FeedbackResult'
    ConversationDeletionResult:
      type: object
      required: [conversation_id, deleted]
      properties:
        conversation_id:
          type: string
        deleted:
          type: boolean
          enum: [true]
    ConversationDeletionEnvelope:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiSuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ConversationDeletionResult'
